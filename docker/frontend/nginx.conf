# Production nginx config for the React static build.
# Serves the SPA and reverse-proxies /api/* to the backend container by
# its Docker Compose service name ("backend") over the shared network.
#
# This is infrastructure configuration only — no application routes/logic
# are defined here beyond the SPA fallback and reverse-proxy pass-through.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA routing: fall back to index.html for any unmatched path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to the backend service
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache immutable static assets
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
