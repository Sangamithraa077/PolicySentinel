# PolicySentinel — Production Overlay (PLACEHOLDER)
#
# Not a deployable production config as-is — this documents the intended
# shape of a production deployment on top of docker-compose.yml. Real
# secrets management, TLS termination, and orchestration (e.g. Kubernetes,
# ECS) should replace this file before go-live; it is provided as a
# docker-compose-native placeholder suitable for a single-host deployment.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# No application logic is defined here — deployment-shape overrides only.

services:

  postgres:
    restart: always
    # `!override` is required here: Compose *merges* (concatenates) `ports:`
    # across -f files by default, it does not replace them — a plain
    # `ports: []` silently has no effect and the base file's 5432:5432
    # mapping stays published. Verified against docker-compose.yml + this
    # file with `docker compose config`; without !override the DB port
    # leaks to the host in "production" despite this comment saying it doesn't.
    ports: !override []   # do not expose the DB port to the host in production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  neo4j:
    restart: always
    # !override so this replaces (not appends to) the base file's bolt+http
    # port list — see the postgres comment above for why plain `ports:` merges.
    ports: !override
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # keep Browser access behind a VPN/firewall rule, not public
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  backend:
    build:
      target: production
    restart: always
    # Not published to the host: the frontend's nginx already reverse-proxies
    # /api/* to this service over the internal Docker network (see
    # docker/frontend/nginx.conf), and with no authentication implemented
    # yet (see README > Known limitations), the API shouldn't have a second,
    # un-proxied public entry point. This also means /docs, /openapi.json,
    # and /health are internal-only in production — reach them with
    # `docker exec policysentinel-backend curl localhost:8000/health`, or
    # add an nginx `location` for them if you want them public.
    ports: !override []
    # No bind mount in production — the image is immutable; uploads/logs
    # remain on named volumes only. !override is required: plain `volumes:`
    # merges with (doesn't replace) the base file's list, so without it the
    # dev bind mount `./backend:/app/backend` would still apply on top of
    # the production image here too — shadowing the baked-in code with a
    # host path that won't even exist on a real server.
    volumes: !override
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    deploy:
      # NOTE: replicas > 1 requires removing the fixed container_name set in
      # docker-compose.yml (container names must be unique per container).
      # Horizontal scaling in real production is expected to be handled by
      # an orchestrator (Kubernetes/ECS) rather than plain docker-compose;
      # left at 1 here to keep this file runnable as a single-host placeholder.
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
      restart_policy:
        condition: on-failure
        max_attempts: 3

  frontend:
    build:
      target: production
    restart: always
    # !override on both: see the postgres/backend comments above — plain
    # `ports:`/`volumes:` merge with the base file's dev entries instead of
    # replacing them, so without !override the container would end up with
    # both 3000:3000 (a port nginx never listens on) and 80:80 published,
    # and the dev source bind mount would still be layered on top of the
    # built static image.
    ports: !override
      - "${FRONTEND_PORT:-80}:80"   # nginx serves on 80 in the production image, not 3000
    volumes: !override []   # no bind mount — static assets are baked into the image
    deploy:
      # See note on backend.deploy.replicas above.
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

# --- Secrets (placeholder) ---
# Production credentials should come from a secrets manager or Docker/K8s
# secrets rather than the .env file used in development. Example shape
# once adopted (requires `secrets:` blocks referencing external files,
# omitted here since no secret material exists in this scaffold):
#
# secrets:
#   postgres_password:
#     external: true
#   jwt_secret_key:
#     external: true
