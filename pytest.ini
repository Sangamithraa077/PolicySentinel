[pytest]
pythonpath = .
testpaths = tests
markers =
    file_upload: verifies file upload behavior
    metadata_storage: verifies policy/version metadata is persisted correctly
    file_retrieval: verifies downloading a stored file
    file_deletion: verifies soft-delete behavior
    validation: verifies input/file validation rules
    error_handling: verifies error responses and status codes
    text_extraction: verifies document parsing extracts and cleans text
    text_normalization: verifies text normalization removes noise and preserves structure
    clause_segmentation: verifies clause segmentation, ordering, and hierarchy
    clause_ordering: verifies clauses are sequenced in correct document order
    api_response: verifies REST API response shape, status codes, and contract
