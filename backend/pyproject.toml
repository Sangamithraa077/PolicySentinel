# Tool configuration only — dependency management stays in requirements.txt
# (pip), not Poetry. See ARCHITECTURE.md §12 for coding standards.

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
